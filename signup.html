<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup // CodeBench</title>


    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/signup.css">


</head>


<body>



    <header class="navbar">


        <a href="index.html" class="logo-text">

            <span>//</span> CODEBENCH

        </a>



        <a href="index.html" class="btn btn-secondary">

            Return Home

        </a>


    </header>







    <main class="signup-layout">





        <section class="signup-card soft-panel fade-in">



            <p class="panel-label">

                CODEBENCH ACADEMY

            </p>




            <h1>

                Create Builder Profile

            </h1>




            <p class="signup-description">

                Set up your learning profile and begin your robotics journey.

            </p>








            <form>




                <label>

                    Name

                </label>


                <input id="username" type="text" placeholder="Your name">





                <label>

                    Email

                </label>


                <input id="email" type="email" placeholder="Email">





                <label>

                    Password

                </label>


                <input id="password" type="password" placeholder="Password">







                <button id="signupBtn" class="btn btn-primary" type="button">


                    Create Account


                </button>





            </form>







            <div class="login-divider">

                OR

            </div>







            <button id="googleSignupBtn" class="btn btn-secondary" type="button">


                Continue with Google


            </button>






            <p class="switch">

                Already have an account?

                <a href="login.html">

                    Sign In

                </a>


            </p>






        </section>






    </main>








    <script type="module" src="js/signup.js"></script>


</body>

</html>
